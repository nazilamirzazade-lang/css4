<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Банковские карты</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="cards-grid">
    
    
    <div class="card card-purple">
      <div class="card-top">
        <img src="симка.png" alt="Чип" class="chip-img">
      </div>
      <div class="card-number">4500 6812 5512 6089</div>
      <div class="card-bottom">
        <div class="holder-info">
          <div class="card-holder">ALEKSEEV IVAN</div>
          <div class="valid-thru">
            <span>Valid thru:</span>
            <span class="date">07/22</span>
          </div>
        </div>
      
        <img src="виза.png" alt="VISA" class="visa-img">
      </div>
    </div>


    <div class="card card-tinkoff">
      <div class="card-top">
        <img src="симка.png" alt="Чип" class="chip-img">
        <div class="tinkoff-logo">
          <div class="tinkoff-shield">🛡️</div>
          <div class="tinkoff-text">
            <span class="tinkoff-title">Тинькофф</span>
            <span class="tinkoff-sub">Банк</span>
          </div>
        </div>
      </div>
      <div class="card-number">4500 6812 5512 6089</div>
      <div class="card-bottom">
        <div class="holder-info">
          <div class="card-holder">ALEKSEEV IVAN</div>
          <div class="valid-thru">
            <span>Valid thru:</span>
            <span class="date">07/22</span>
          </div>
        </div>
        <img src="виза.png" alt="VISA" class="visa-img">
      </div>
    </div>

    <div class="card card-sber">
      <div class="card-top">
        <img src="симка.png" alt="Чип" class="chip-img">
       
        <img src="sber.png" alt="Sberbank" class="sber-img">
      </div>
      <div class="card-number">4500 6812 5512 6089</div>
      <div class="card-bottom">
        <div class="holder-info">
          <div class="card-holder">ALEKSEEV IVAN</div>
          <div class="valid-thru">
            <span>Valid thru:</span>
            <span class="date">07/22</span>
          </div>
        </div>
        <div class="mastercard-logo">
          <div class="mc-circle mc-red"></div>
          <div class="mc-circle mc-orange"></div>
          <span class="mc-text">MasterCard</span>
        </div>
      </div>
    </div>

    
    <div class="card card-vtb">
      <div class="card-top">
        <img src="симка.png" alt="Чип" class="chip-img">
        <div class="vtb-logo">
          <div class="vtb-lines">
            <div class="vtb-line"></div>
            <div class="vtb-line"></div>
            <div class="vtb-line"></div>
          </div>
          <span class="vtb-text">ВТБ24</span>
        </div>
      </div>
      <div class="card-number">4500 6812 5512 6089</div>
      <div class="card-bottom">
        <div class="holder-info">
          <div class="card-holder">ALEKSEEV IVAN</div>
          <div class="valid-thru">
            <span>Valid thru:</span>
            <span class="date">07/22</span>
          </div>
        </div>
        <div class="mastercard-logo">
          <div class="mc-circle mc-red"></div>
          <div class="mc-circle mc-orange"></div>
          <span class="mc-text">MasterCard</span>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
